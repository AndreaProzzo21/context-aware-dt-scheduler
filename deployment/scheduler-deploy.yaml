apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-twin-scheduler
  namespace: kube-system
  labels:
    app: iot-twin-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-twin-scheduler
  template:
    metadata:
      labels:
        app: iot-twin-scheduler
    spec:
      serviceAccountName: iot-twin-scheduler # Fondamentale per i permessi RBAC

      # Il watch interno può restare in attesa fino a WATCH_STREAM_TIMEOUT_SECONDS
      # (default 120s) prima di ricontrollare se deve spegnersi.
      terminationGracePeriodSeconds: 130

      containers:
      - name: scheduler
        image: aprozzo/iot-twin-scheduler:v0.3 # <-- Ricorda di aggiornare il tag della nuova build!
        imagePullPolicy: Always
        env:
        - name: PROMETHEUS_URL
          value: "http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090"

        # --- Tuning rete/watch ---
        - name: PROMETHEUS_TIMEOUT_SECONDS
          value: "6"
        - name: WATCH_STREAM_TIMEOUT_SECONDS
          value: "120"
        - name: WATCH_ERROR_BACKOFF_SECONDS
          value: "5"
        - name: MAX_CONSECUTIVE_FALLBACKS_WARNING
          value: "5"

        # --- Resource awareness (hard filter + scoring pesato CPU/RAM) ---
        - name: MAX_CPU_USAGE_PERCENT
          value: "85"
        - name: MAX_MEM_USAGE_PERCENT
          value: "85"
        - name: WEIGHT_STRATEGY
          value: "0.6"
        - name: WEIGHT_CPU
          value: "0.2"
        - name: WEIGHT_MEM
          value: "0.2"

        # --- NUOVO: Configurazione Entanglement Watchdog (RCA) ---
        - name: WATCHDOG_INTERVAL_SECONDS
          value: "16"
        - name: SUSTAINED_CHECKS_REQUIRED
          value: "3"
        - name: GRACE_PERIOD_SECONDS
          value: "35"
        - name: COOLDOWN_SECONDS
          value: "180"
        - name: DEFAULT_ENTANGLEMENT_THRESHOLD_MS
          value: "300"

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi # Alzato per evitare OOMKilled con il multi-threadings