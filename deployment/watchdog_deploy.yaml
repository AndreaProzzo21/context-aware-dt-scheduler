---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entanglement-watchdog
  namespace: kube-system
  labels:
    app: entanglement-watchdog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entanglement-watchdog
  template:
    metadata:
      labels:
        app: entanglement-watchdog
    spec:
      serviceAccountName: entanglement-watchdog
      containers:
      - name: watchdog
        image: aprozzo/entanglement-watchdog:v0.1
        imagePullPolicy: Always
        env:
        - name: PROMETHEUS_URL
          value: "http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
        - name: SCHEDULER_NAME
          value: "iot-twin-scheduler"
        - name: WATCHDOG_INTERVAL_SECONDS
          value: "20"
        - name: SUSTAINED_CHECKS_REQUIRED
          value: "3"
        - name: GRACE_PERIOD_SECONDS
          value: "60"
        - name: COOLDOWN_SECONDS
          value: "180"
        - name: MAX_RESCHEDULES_PER_HOUR
          value: "5"
        - name: DEFAULT_ENTANGLEMENT_THRESHOLD_MS
          value: "500"
        resources:
          requests:
            cpu: 64m
            memory: 50Mi
          limits:
            cpu: 128m
            memory: 200Mi