---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-twin-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iot-twin-scheduler
rules:
  # Base + Watchdog: Leggere ed ELIMINARE i pod (RCA Trigger)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
    
  # Eseguire il binding pod -> nodo
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
    
  # Leggere stato e capacità allocabile dei nodi
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
    
  # Resource awareness via Metrics Server
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
    
  # Eventi Kubernetes (utile per il tracking delle azioni del watchdog)
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iot-twin-scheduler
subjects:
  - kind: ServiceAccount
    name: iot-twin-scheduler
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: iot-twin-scheduler
  apiGroup: rbac.authorization.k8s.io