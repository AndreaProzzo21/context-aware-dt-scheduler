apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: digital-twin-monitor
  namespace: default
spec:
  selector:
    matchLabels:
      app: digital-twin # Deve corrispondere alla label del tuo Twin
  podMetricsEndpoints:
  - port: metrics # Il nome della porta che abbiamo appena aggiunto
    path: /metrics
    interval: 5s # Prometheus leggerà i dati ogni 5 secondi