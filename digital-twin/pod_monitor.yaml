apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: digital-twin-monitor
  namespace: default
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values: ["digital-twin-custom", "digital-twin-default"]
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 5s