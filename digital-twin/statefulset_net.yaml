        app: digital-twin-default
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Nessun schedulerName specificato -> usa il kube-scheduler di default
      containers:
      - name: twin
        image: aprozzo/dt-entanglement:v3
        imagePullPolicy: Always
        ports:
        - name: metrics
          containerPort: 8000
        env:
        - name: DEGRADATION_START_SEC
          value: "300.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MQTT_BROKER
          value: "mosquitto-broker.default.svc.cluster.local"