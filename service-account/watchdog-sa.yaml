apiVersion: v1
kind: ServiceAccount
metadata:
  name: entanglement-watchdog
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: entanglement-watchdog
rules:
  # Legge i pod (per trovare i twin Running) e li elimina per farli
  # ricreare dal loro controller (StatefulSet). MAI create su pods/binding:
  # questo componente non decide MAI dove ripiazzare un twin, solo se farlo.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Per emettere il preavviso (Event) prima di agire.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: entanglement-watchdog
subjects:
  - kind: ServiceAccount
    name: entanglement-watchdog
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: entanglement-watchdog
  apiGroup: rbac.authorization.k8s.io